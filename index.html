*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102039;color:white;font-family:system-ui;touch-action:none}button{background:#245879;color:white;border:1px solid #ffffff40;border-radius:10px;padding:10px;font-weight:800}#scene{position:fixed;inset:0}.top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 6px #000}.stats,.panel,.hud{background:#102039df;border:1px solid #ffffff35;border-radius:12px;padding:9px}.panel{position:absolute;left:10px;top:55px;bottom:10px;width:min(330px,45vw);overflow:auto;background:#102039ed}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:6px;align-items:center;margin:8px 0}.primary{background:#edaa37;color:#172033}.wide{width:100%}.muted{font-size:12px;color:#c4d4e4}.gamehud{display:none;position:absolute;inset:0;pointer-events:none}.health{position:absolute;bottom:8px;left:10px}.ammo{position:absolute;bottom:8px;right:10px;text-align:right}.slots{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.slot{background:#102039dd;border:2px solid #ffffff55;border-radius:8px;padding:7px;min-width:48px;text-align:center;font-size:12px}.slot.active{border-color:#ffda62}.touch{display:none;position:absolute;inset:0;pointer-events:none}.joy{position:absolute;left:16px;bottom:18px;width:125px;height:125px;border:2px solid #ffffff88;background:#ffffff20;border-radius:50%;pointer-events:auto}.knob{position:absolute;left:35px;top:35px;width:52px;height:52px;border-radius:50%;background:#e5f7ffbb;border:2px solid white}.actions{position:absolute;right:12px;bottom:18px;display:grid;grid-template-columns:repeat(2,58px);gap:7px;pointer-events:auto}.actions button{width:58px;height:58px;border-radius:50%;padding:0;font-size:10px}.hint{position:absolute;right:10px;top:43%;font-size:10px;text-shadow:0 1px 4px blac </style></head><body><div id="scene"></div><div id="rotate">Bitte iPhone ins Querformat drehen ↻</div><div class="top"><div>🟡 TEAPACKS ROYALE</div><div class="stats">🟡 <span id="coins">10000</span> TP　⭐ <span id="level">1</span>　XP <span id="xp">0</span></div></div>
<div class="panel" id="panel"><h2 id="heading">Bereit für den Drop?</h2><p class="muted" id="desc">Splitterküste wartet auf dich. Sammle Loot und überlebe!</p><div class="nav"><button onclick="show('play')">▶ Spielen</button><button onclick="show('shop')">🛒 Item-Shop</button><button onclick="show('locker')">🎒 Spind</button><button onclick="show('pass')">⭐ Battle Pass</button><button onclick="show('settings')">⚙ Einstellungen</button></div><div id="content"></div></div><div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=x=>document.getElementById(x);let coins=Number(localStorage.tpCoins??10000),xp=Number(localStorage.tpXP||0),owned=JSON.parse(localStorage.tpOwned||'["Basis-Outfit"]'),equipped=localStorage.tpEquipped||'Basis-Outfit';if(localStorage.tpCoins===null)coins=10000;
const names=['Basis-Outfit','Neon-Nomade','Waldläufer','Chrom-Bot','Sternen-Ritter','Turbo-Fuchs','Frost-Forscher','Pixel-Panda','Robo-Ranger','Nachtfalke','Wüsten-Wanderer','Kometen-Pilot','Dschungel-Scout','Vulkan-Krieger','Ozean-Taucher','Cyber-Sprinter','Goldener Wächter','Polar-Phantom','Street-Skater','Schatten-Agent'];const skins=Array.from({length:100},(_,i)=>({name:i<names.length?names[i]:`Outfit ${String(i+1).padStart(3,'0')}`,color:new THREE.Color().setHSL((i*.61803398875)%1,.55,.48).getHex(),price:i===0?0:1000}));
let scene,camera,renderer,player,game=false,camYaw=0,camPitch=.12,playerYaw=0,moveX=0,moveY=0,joyId=null,lookId=null,lastLook=null,keys={},health=100,kills=0,ammo=0,resources={wood:0,stone:0,metal:0},inventory=['Spitzhacke',null,null,null,null,null],selected=0,mode='Solo',difficulty='Normal',bots=[],nodes=[],chests=[],teammates=[],botGroups=[];
const weapons=['Sturmgewehr','Maschinenpistole','Schrotflinte','Scharfschützengewehr','Pistole'];function mat(c,r=.65,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function cube(p,x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function save(){localStorage.tpCoins=coins;localStorage.tpXP=xp;localStorage.tpOwned=JSON.stringify(owned);localStorage.tpEquipped=equipped;$('coins').textContent=coins;$('xp').textContent=xp;$('level').textContent=1+Math.floor(xp/500)}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1800)}
function makePlayer(){if(player)scene.remove(player);player=new THREE.Group();let c=skins.find(s=>s.name===equipped)?.color||0x299eb4;let suit=mat(c),skin=mat(0xd9a47e),hair=mat(0x39251d);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.62,6,12),suit);body.position.y=1.25;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.27,18,14),skin);head.position.y=2.05;player.add(head);let haircap=new THREE.Mesh(new THREE.SphereGeometry(.28,16,10,0,Math.PI*2,0,Math.PI*.6),hair);haircap.position.y=2.15;player.add(haircap);for(let x of [-.1,.1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.03,8,8),mat(0x172536));eye.position.set(x,2.07,-.25);player.add(eye)}for(let s of [-1,1]){let a=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.52,5,9),suit);a.position.set(s*.45,1.25,0);player.add(a);let l=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,5,9),mat(0x263b58));l.position.set(s*.17,.48,0);player.add(l);cube(player,s*.17,.1,-.08,.24,.18,.38,mat(0x18202c))}cube(player,0,1.3,.34,.42,.48,.18,mat(0x25364a));scene.add(player)}
function addTree(x,z){let g=new THREE.Group();let tr=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,1.8,8),mat(0x79523a));tr.position.y=.9;g.add(tr);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,1),mat(0x28794b));crown.position.y=2.3;g.add(crown);g.position.set(x,0,z);scene.add(g);nodes.push({obj:g,type:'wood',hp:3,x,z})}function addRock(x,z){let o=new THREE.Mesh(new THREE.DodecahedronGeometry(.9,1),mat(0x858d94));o.position.set(x,.65,z);scene.add(o);nodes.push({obj:o,type:'stone',hp:4,x,z})}
function addBuilding(x,z){let g=new THREE.Group();let wall=mat(0xb9a27e);cube(g,0,.12,0,7,.24,7,mat(0x88745a));cube(g,0,3.0,0,7.4,.3,7.4,mat(0x684a40));cube(g,-3.42,1.5,0,.16,3,7,wall);cube(g,3.42,1.5,0,.16,3,7,wall);cube(g,0,1.5,3.42,7,3,.16,wall);cube(g,-2.1,1.5,-3.42,2.8,3,.16,wall);cube(g,2.1,1.5,-3.42,2.8,3,.16,wall);g.position.set(x,0,z);scene.add(g);let chest=new THREE.Mesh(new THREE.BoxGeometry(.9,.55,.6),mat(0xd5a42d,.35,.4));chest.position.set(x+1,.3,z+1);scene.add(chest);chests.push({obj:chest,x:x+1,z:z+1,opened:false});let ammoBox=new THREE.Mesh(new THREE.BoxGeometry(.7,.5,.55),mat(0x6d9d45));ammoBox.position.set(x-1,.25,z+1);scene.add(ammoBox);chests.push({obj:ammoBox,x:x-1,z:z+1,opened:false,ammo:true})}
function addBot(x,z,team){let g=new THREE.Group(),color=new THREE.Color().setHSL(Math.random(),.55,.5).getHex();let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.55,4,8),mat(color));torso.position.y=1.15;g.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),mat(0xc99b75));head.position.y=1.9;g.add(head);for(let s of [-1,1]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.45,4,8),mat(0x26364b));leg.position.set(s*.15,.42,0);g.add(leg)}g.position.set(x,0,z);scene.add(g);let b={obj:g,x,z,hp:100,team,phase:Math.random()*6.28,alive:true};bots.push(b);return b}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd5ed);scene.fog=new THREE.Fog(0x8bd5ed,70,210);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,400);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;$('scene').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdaf4ff,0x526047,2));let sun=new THREE.DirectionalLight(0xffedcf,2.5);sun.position.set(-30,50,-25);sun.castShadow=true;scene.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x65a95c));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);let water=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x269fc4,.25,.1));water.rotation.x=-Math.PI/2;water.position.y=-.4;scene.add(water);for(let i=0;i<65;i++){let x=(Math.random()-.5)*175,z=(Math.random()-.5)*175;if(Math.hypot(x,z)>12)addTree(x,z)}for(let i=0;i<20;i++){let x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.hypot(x,z)>15)addRock(x,z)}for(let i=0;i<12;i++){let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)>18)addBuilding(x,z)}makePlayer();resize();animate()}function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function updateSlots(){let el=$('slots');el.innerHTML='';inventory.forEach((v,i)=>{let d=document.createElement('div');d.className='slot'+(i===selected?' active':'');d.textContent=(i===0?'⛏ ':`${i} `)+(v||'Leer');el.appendChild(d)});$('weaponName').textContent=inventory[selected]||'Leer';$('ammoCount').textContent=ammo}
function animate(){requestAnimationFrame(animate);if(game&&player){let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-moveY,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+moveX,L=Math.hypot(f,s);if(L>.08){f/=Math.max(1,L);s/=Math.max(1,L);let fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw),dx=fx*f+rx*s,dz=fz*f+rz*s;player.position.x+=dx*.11;player.position.z+=dz*.11;let desired=Math.atan2(-dx,-dz),delta=Math.atan2(Math.sin(desired-playerYaw),Math.cos(desired-playerYaw));playerYaw+=delta*.2}player.rotation.y=playerYaw;let target=new THREE.Vector3(player.position.x,1.45,player.position.z),dist=4.3,offset=new THREE.Vector3(Math.sin(camYaw)*dist,1.5+camPitch*3,Math.cos(camYaw)*dist);camera.position.lerp(target.clone().add(offset),.2);camera.lookAt(target);for(let b of bots){if(!b.alive)continue;b.phase+=.012;let dx=player.position.x-b.x,dz=player.position.z-b.z,d=Math.hypot(dx,dz);if(d<24){b.x+=dx/(d||1)*.018;b.z+=dz/(d||1)*.018;b.obj.rotation.y=Math.atan2(-dx,-dz)}else{b.x+=Math.sin(b.phase)*.009;b.z+=Math.cos(b.phase)*.009}b.obj.position.set(b.x,0,b.z)}$('remaining').textContent=1+bots.filter(b=>b.alive).length+teammates.length}renderer.render(scene,camera)}
window.show=tab=>{game=false;$('gamehud').style.display='none';$('touch').style.display='none';$('panel').style.display='block';let c=$('content');c.innerHTML='';if(tab==='play'){$('heading').textContent='Bereit für den Drop?';$('desc').textContent='99 Gegner, Loot, Teams und eine große Insel.';c.innerHTML=`<b>Spielmodus</b><div class="row"><button onclick="setMode('Solo')">Solo</button><button onclick="setMode('Duo')">Duo</button><button onclick="setMode('Trio')">Trio</button><button onclick="setMode('Team')">Team</button></div><b>Schwierigkeit</b><div class="row"><button onclick="difficulty='Einfach'">Einfach</button><button onclick="difficulty='Normal'">Normal</button><button onclick="difficulty='Schwer'">Schwer</button><button onclick="difficulty='Experte'">Experte</button></div><button class="primary wide" onclick="startGame()">▶ BATTLE ROYALE STARTEN</button><p class="muted">PC: WASD · Maus umsehen · Linksklick Aktion. iPhone: Joystick links, rechte Seite ziehen.</p>`}else if(tab==='shop'){$('heading').textContent='Item-Shop · 100 Outfits';$('desc').textContent='Jedes Outfit kostet 1.000 Teapacks.';skins.forEach(s=>{let r=document.createElement('div');r.className='row';let t=document.createElement('span');t.textContent='🧑‍🚀 '+s.name+' · '+s.price+' TP';let b=document.createElement('button');b.textContent=owned.includes(s.name)?'Besitzt du':'Kaufen';b.onclick=()=>{if(owned.includes(s.name))return toast('Bereits freigeschaltet');if(coins<s.price)return toast('Nicht genug Teapacks');coins-=s.price;owned.push(s.name);save();show('shop');toast('Outfit gekauft!')};r.append(t,b);c.append(r)})}else if(tab==='locker'){$('heading').textContent='Spind';$('desc').textContent='Wähle dein Outfit.';skins.filter(s=>owned.includes(s.name)).forEach(s=>{let b=document.createElement('button');b.className='wide';b.textContent=(equipped===s.name?'✓ ':'')+s.name;b.onclick=()=>{equipped=s.name;localStorage.tpEquipped=equipped;makePlayer();show('locker')};c.append(b)})}else if(tab==='pass'){$('heading').textContent='Battle Pass';$('desc').textContent=`Level ${1+Math.floor(xp/500)} · ${xp%500}/500 XP`;c.innerHTML='<p class="muted">Spiele Runden und sammle Erfahrungspunkte.</p>'}else{$('heading').textContent='Einstellungen';$('desc').textContent='Grafik und Steuerung';c.innerHTML='<p class="muted">Querformat empfohlen. Kameraempfindlichkeit und Grafik werden in dieser Version automatisch angepasst.</p>'}};
window.setMode=m=>{mode=m;toast(m+' ausgewählt')};window.startGame=()=>{game=true;$('panel').style.display='none';$('gamehud').style.display='block';$('touch').style.display='block';player.position.set(0,0,0);playerYaw=camYaw=0;bots.forEach(b=>scene.remove(b.obj));bots=[];teammates=[];let teamSize={Solo:1,Duo:2,Trio:3,Team:4}[mode];for(let i=1;i<teamSize;i++){let mate=addBot(-2-i,2,`playerteam`);mate.team='player';teammates.push(mate)}let enemyCount=99-(teamSize-1);let squadSize=teamSize;for(let i=0;i<enemyCount;i++){let squad=Math.floor(i/squadSize);addBot((Math.random()-.5)*115,(Math.random()-.5)*115,'enemy-'+squad)}health=100;kills=0;resources={wood:0,stone:0,metal:0};ammo=0;inventory=['Spitzhacke',null,null,null,null,null];selected=0;updateSlots();$('hp').textContent=health;$('wood').textContent=0;$('stone').textContent=0;$('metal').textContent=0;toast(`${mode}: ${enemyCount} Gegner-Bots. Sammle Ausrüstung!`)};
function nearNode(){return nodes.find(n=>n.hp>0&&Math.hypot(n.x-player.position.x,n.z-player.position.z)<3)}function gather(){let n=nearNode();if(n){let type=n.type;n.hp--;resources[type]=Math.min(999,resources[type]+(type==='wood'?35:25));$(type).textContent=resources[type];if(n.hp<=0){scene.remove(n.obj);n.hp=0}toast(`+${type==='wood'?35:25} ${type}`);return}let c=chests.find(c=>!c.opened&&Math.hypot(c.x-player.position.x,c.z-player.position.z)<3);if(c){c.opened=true;scene.remove(c.obj);if(c.ammo){ammo+=60;toast('+60 Munition')}else{let w=weapons[Math.floor(Math.random()*weapons.length)];let slot=inventory.findIndex((v,i)=>i>0&&!v);if(slot<0)slot=1;inventory[slot]=w;ammo+=30;toast(`${w} gefunden! +30 Munition`)}updateSlots();return}toast('Nichts in Reichweite')}
function attack(){if(selected===0){gather();return}if(!inventory[selected])return toast('Dieser Waffenplatz ist leer');if(ammo<=0)return toast('Keine Munition – suche Munitionskisten!');ammo--;updateSlots();let b=bots.filter(b=>b.alive&&Math.hypot(b.x-player.position.x,b.z-player.position.z)<18).sort((a,b)=>Math.hypot(a.x-player.position.x,a.z-player.position.z)-Math.hypot(b.x-player.position.x,b.z-player.position.z))[0];if(b){b.hp-=35;if(b.hp<=0){b.alive=false;scene.remove(b.obj);kills++;$('kills').textContent=kills;$('remaining').textContent=1+bots.filter(x=>x.alive).length+teammates.length;toast('Bot ausgeschaltet!')}else toast('Treffer!')}else toast('Schuss abgegeben')}
$('joy').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joyId=e.pointerId;$('joy').setPointerCapture(e.pointerId)});$('joy').addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;let r=$('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=38;if(l>m){dx*=m/l;dy*=m/l}moveX=dx/m;moveY=dy/m;$('knob').style.transform=`translate(${dx}px,${dy}px)`});function joyEnd(e){if(e.pointerId===joyId){joyId=null;moveX=moveY=0;$('knob').style.transform=''}}$('joy').addEventListener('pointerup',joyEnd);$('joy').addEventListener('pointercancel',joyEnd);
$('scene').addEventListener('pointerdown',e=>{if(game&&e.clientX>innerWidth*.4){lookId=e.pointerId;lastLook={x:e.clientX,y:e.clientY}}});$('scene').addEventListener('pointermove',e=>{if(e.pointerId!==lookId||!lastLook)return;let dx=e.clientX-lastLook.x,dy=e.clientY-lastLook.y;camYaw-=dx*.006;camPitch=Math.max(-.35,Math.min(.55,camPitch+dy*.004));lastLook={x:e.clientX,y:e.clientY}});function lookEnd(e){if(e.pointerId===lookId){lookId=null;lastLook=null}}$('scene').addEventListener('pointerup',lookEnd);$('scene').addEventListener('pointercancel',lookEnd);addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){let n=Number(e.code.slice(5));if(n>=1&&n<=5){selected=n;updateSlots()}}});addEventListener('keyup',e=>keys[e.code]=false);$('fire').onclick=attack;$('use').onclick=gather;$('switch').onclick=()=>{selected=(selected+1)%6;updateSlots()};$('jump').onclick=()=>{player.position.y=.55;setTimeout(()=>player.position.y=0,260)};init();save();show('play');updateSlots();
