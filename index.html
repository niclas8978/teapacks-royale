<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Teapacks Royale</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102039;color:#fff;font-family:system-ui;touch-action:none}#scene{position:fixed;inset:0}button{background:#245879;color:#fff;border:1px solid #ffffff45;border-radius:10px;padding:10px;font-weight:800}.top{position:absolute;z-index:2;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none}.stats,.panel,.hud{background:#102039e8;border:1px solid #ffffff40;border-radius:12px;padding:9px}.panel{position:absolute;z-index:3;left:10px;top:55px;bottom:10px;width:min(330px,45vw);overflow:auto;background:#102039ed}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:8px 0}.primary{background:#edaa37;color:#172033}.wide{width:100%}.muted{font-size:12px;color:#c6d7e5}.gamehud{display:none;position:absolute;inset:0;pointer-events:none;z-index:2}.health{position:absolute;bottom:10px;left:10px}.ammo{position:absolute;bottom:10px;right:10px;text-align:right}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px}.cross:before,.cross:after{content:'';position:absolute;background:white;box-shadow:0 0 3px #000}.cross:before{width:2px;height:22px;left:11px;top:1px}.cross:after{height:2px;width:22px;top:11px;left:1px}.slots{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);display:flex;gap:4px}.slot{background:#102039df;border:2px solid #ffffff60;border-radius:7px;padding:6px;min-width:43px;text-align:center;font-size:10px}.slot.active{border-color:#ffdc62}.touch{display:none;position:absolute;z-index:4;inset:0;pointer-events:none}.joy{position:absolute;left:16px;bottom:18px;width:124px;height:124px;border:2px solid #ffffff80;background:#ffffff20;border-radius:50%;pointer-events:auto}.knob{position:absolute;left:34px;top:34px;width:52px;height:52px;border-radius:50%;background:#e5f7ffbb;border:2px solid white}.actions{position:absolute;right:12px;bottom:18px;display:grid;grid-template-columns:repeat(2,58px);gap:7px;pointer-events:auto}.actions button{width:58px;height:58px;border-radius:50%;padding:0;font-size:10px}.hint{position:absolute;right:10px;top:42%;font-size:10px;text-shadow:0 1px 4px black}.toast{display:none;position:absolute;z-index:8;top:18%;left:50%;transform:translateX(-50%);background:#102039ed;padding:10px;border-radius:10px}#rotate{display:none;position:fixed;z-index:9;inset:0;background:#102039;align-items:center;justify-content:center;text-align:center;font-size:20px}@media(orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style></head><body><div id="scene"></div><div id="rotate">Bitte iPhone ins Querformat drehen ↻</div><div class="top"><div>🟡 TEAPACKS ROYALE</div><div class="stats">🟡 <span id="coins">10.000</span> TP · ⭐ <span id="level">1</span></div></div><div class="panel" id="panel"><h2 id="heading">Bereit für den Drop?</h2><p class="muted" id="desc">Splitterküste – sammle Loot und spiele deine Runde.</p><div class="nav"><button onclick="show('play')">▶ Spielen</button><button onclick="show('shop')">🛒 Item-Shop</button><button onclick="show('locker')">🎒 Spind</button><button onclick="show('pass')">⭐ Battle Pass</button><button onclick="show('settings')">⚙ Einstellungen</button></div><div id="content"></div></div><div class="toast" id="toast"></div><div class="gamehud" id="gamehud"><div class="cross"></div><div class="hud health">❤️ <span id="hp">100</span> · 🪵 <span id="wood">0</span> 🪨 <span id="stone">0</span> ⚙ <span id="metal">0</span></div><div class="hud ammo">🔫 <span id="weaponName">Spitzhacke</span><br>Munition: <span id="ammoCount">0</span> · 👥 <span id="remaining">99</span></div><div class="slots" id="slots"></div></div><div class="touch" id="touch"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button id="jump">SPRUNG</button><button id="use">LOOT</button><button id="switch">WAFFE</button><button id="fire">FEUER</button></div><div class="hint">Rechte Seite ziehen: Kamera<br>Tippen: Schießen</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);const STORE='teapacksRoyale_v5_';let coins=localStorage.getItem(STORE+'coins')===null?10000:Number(localStorage.getItem(STORE+'coins')),xp=+(localStorage.getItem(STORE+'xp')||0),owned=JSON.parse(localStorage.getItem(STORE+'owned')||'["Basis-Outfit"]'),equipped=localStorage.getItem(STORE+'equipped')||'Basis-Outfit',pass=localStorage.getItem(STORE+'pass')==='true';
const outfitNames=['Basis-Outfit','Neon-Nomade','Waldläufer','Chrom-Bot','Sternen-Ritter','Turbo-Fuchs','Frost-Forscher','Pixel-Panda','Robo-Ranger','Nachtfalke',...Array.from({length:90},(_,i)=>`Outfit ${String(i+11).padStart(3,'0')}`)];const outfits=outfitNames.map((name,i)=>({name,color:new THREE.Color().setHSL((i*.61803398875)%1,.62,.48).getHex()}));const weaponNames=['Spitzhacke','Sturmgewehr','Maschinenpistole','Schrotflinte','Scharfschützengewehr','Pistole'];let scene,camera,renderer,player,gun,muzzle,game=false,camYaw=0,camPitch=.1,playerYaw=0,moveX=0,moveY=0,joyId=null,lookId=null,lastLook=null,keys={},ammo=0,selected=0,inventory=['Spitzhacke',null,null,null,null,null],resources={wood:0,stone:0,metal:0},nodes=[],loot=[],bots=[],shotFlash=0;
function save(){localStorage.setItem(STORE+'coins',coins);localStorage.setItem(STORE+'xp',xp);localStorage.setItem(STORE+'owned',JSON.stringify(owned));localStorage.setItem(STORE+'equipped',equipped);localStorage.setItem(STORE+'pass',String(pass));$('coins').textContent=coins.toLocaleString('de-DE');$('level').textContent=1+Math.floor(xp/500)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1800)}function mat(c,r=.6,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function box(p,x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function makeGun(type){if(gun)player.remove(gun);gun=new THREE.Group();let bodyColor=type==='Spitzhacke'?0x8b929c:type==='Schrotflinte'?0x79533b:type==='Scharfschützengewehr'?0x344c60:type==='Pistole'?0x56616d:type==='Maschinenpistole'?0x3d6c63:0x384d68;let body=mat(bodyColor,.32,.45);if(type==='Spitzhacke'){let handle=box(gun,0,0,0,.09,.09,.75,mat(0x765039));handle.rotation.x=.2;let head=box(gun,0,.12,-.27,.48,.12,.13,mat(0xb9c5cf,.25,.7));head.rotation.z=-.2}else{let length=type==='Scharfschützengewehr'?1.05:type==='Pistole'?.48:type==='Schrotflinte'?.85:.72;box(gun,0,0,0,.13,.14,length,body);box(gun,0,-.11,.08,.1,.2,.16,mat(0x252b32));box(gun,0,.1,-length*.32,.055,.055,.22,mat(0x171c22));box(gun,0,.02,-length*.58,.07,.07,.22,mat(0x161c22));if(type==='Sturmgewehr'||type==='Maschinenpistole')box(gun,0,-.12,-.12,.09,.2,.12,mat(0x202b32));}gun.position.set(.42,1.18,-.42);gun.rotation.y=-.08;player.add(gun);muzzle=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),mat(0xffd45a,.2));muzzle.position.set(0,.02,-(type==='Scharfschützengewehr'?1.08:type==='Pistole'?.55:type==='Spitzhacke'?.4:.78));muzzle.visible=false;gun.add(muzzle)}
function makePlayer(){if(player)scene.remove(player);player=new THREE.Group();let col=outfits.find(o=>o.name===equipped)?.color||0x299eb4,suit=mat(col),skin=mat(0xd9a47e),hair=mat(0x39251d);let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.62,6,12),suit);torso.position.y=1.25;player.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.27,18,14),skin);head.position.y=2.05;player.add(head);let cap=new THREE.Mesh(new THREE.SphereGeometry(.28,16,10,0,Math.PI*2,0,Math.PI*.6),hair);cap.position.y=2.15;player.add(cap);for(let x of [-.1,.1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.03,8,8),mat(0x172536));eye.position.set(x,2.07,-.25);player.add(eye)}for(let s of [-1,1]){let a=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.52,5,9),suit);a.position.set(s*.45,1.25,0);player.add(a);let l=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,5,9),mat(0x263b58));l.position.set(s*.17,.48,0);player.add(l);box(player,s*.17,.1,-.08,.24,.18,.38,mat(0x18202c))}scene.add(player);makeGun(inventory[selected]||'Spitzhacke')}
function addTree(x,z){let g=new THREE.Group();let tr=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,1.8,8),mat(0x79523a));tr.position.y=.9;g.add(tr);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,1),mat(0x28794b));crown.position.y=2.3;g.add(crown);g.position.set(x,0,z);scene.add(g);nodes.push({obj:g,type:'wood',hp:3,x,z})}function addRock(x,z){let o=new THREE.Mesh(new THREE.DodecahedronGeometry(.9,1),mat(0x858d94));o.position.set(x,.65,z);scene.add(o);nodes.push({obj:o,type:'stone',hp:4,x,z})}function addLoot(x,z,ammoBox=false){let o=new THREE.Mesh(new THREE.BoxGeometry(.75,.5,.55),mat(ammoBox?0x73a64d:0xd6a42c,.3,.3));o.position.set(x,.3,z);scene.add(o);loot.push({obj:o,x,z,ammoBox,opened:false})}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd5ed);scene.fog=new THREE.Fog(0x8bd5ed,70,210);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,400);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;$('scene').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdaf4ff,0x526047,2));let sun=new THREE.DirectionalLight(0xffedcf,2.5);sun.position.set(-30,50,-25);sun.castShadow=true;scene.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x65a95c));ground.rotation.x=-Math.PI/2;scene.add(ground);for(let i=0;i<65;i++){let x=(Math.random()-.5)*175,z=(Math.random()-.5)*175;if(Math.hypot(x,z)>12)addTree(x,z)}for(let i=0;i<22;i++){let x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.hypot(x,z)>15)addRock(x,z)}for(let i=0;i<20;i++){let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)>16)addLoot(x,z,i%3===0)}makePlayer();resize();animate()}function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function slots(){let el=$('slots');el.innerHTML='';inventory.forEach((v,i)=>{let d=document.createElement('div');d.className='slot'+(i===selected?' active':'');d.textContent=(i===0?'⛏':i)+': '+(v||'—');el.appendChild(d)});$('weaponName').textContent=inventory[selected]||'Leer';$('ammoCount').textContent=ammo}function animate(){requestAnimationFrame(animate);if(game&&player){let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-moveY,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+moveX,L=Math.hypot(f,s);if(L>.08){f/=Math.max(1,L);s/=Math.max(1,L);let fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw),dx=fx*f+rx*s,dz=fz*f+rz*s;player.position.x+=dx*.11;player.position.z+=dz*.11;let desired=Math.atan2(-dx,-dz),delta=Math.atan2(Math.sin(desired-playerYaw),Math.cos(desired-playerYaw));playerYaw+=delta*.2}player.rotation.y=playerYaw;let target=new THREE.Vector3(player.position.x,1.45,player.position.z),dist=4.0,offset=new THREE.Vector3(Math.sin(camYaw)*dist,1.25+camPitch*3,Math.cos(camYaw)*dist);camera.position.lerp(target.clone().add(offset),.2);camera.lookAt(target);if(shotFlash>0){shotFlash--;if(muzzle)muzzle.visible=shotFlash>0;gun.position.z=-.42+(shotFlash>0?.16:0)}else if(muzzle)muzzle.visible=false}renderer.render(scene,camera)}
window.show=tab=>{game=false;$('gamehud').style.display='none';$('touch').style.display='none';$('panel').style.display='block';let c=$('content');c.innerHTML='';if(tab==='play'){$('heading').textContent='Bereit für den Drop?';$('desc').textContent='Splitterküste – sammle Loot und spiele deine Runde.';c.innerHTML=`<b>Spielmodus</b><div class="row"><button onclick="setMode('Solo')">Solo</button><button onclick="setMode('Duo')">Duo</button><button onclick="setMode('Trio')">Trio</button><button onclick="setMode('Team')">Team</button></div><button class="primary wide" onclick="startGame()">▶ BATTLE ROYALE STARTEN</button><p class="muted">PC: WASD · Maus umsehen · Linksklick schießen. iPhone: Joystick links, rechts ziehen.</p>`}else if(tab==='shop'){$('heading').textContent='Item-Shop · 100 Outfits';$('desc').textContent='Outfits kosten 1.000 Teapacks.';outfits.forEach(o=>{let r=document.createElement('div');r.className='row';let t=document.createElement('span');t.textContent='🧑‍🚀 '+o.name;let b=document.createElement('button');b.textContent=owned.includes(o.name)?'Besitzt du':'1.000 TP';b.onclick=()=>{if(owned.includes(o.name))return toast('Schon freigeschaltet');if(coins<1000)return toast('Nicht genug Teapacks');coins-=1000;owned.push(o.name);save();show('shop');toast('Outfit gekauft und gespeichert!')};r.append(t,b);c.append(r)})}else if(tab==='locker'){$('heading').textContent='Spind';$('desc').textContent='Deine freigeschalteten Outfits.';outfits.filter(o=>owned.includes(o.name)).forEach(o=>{let b=document.createElement('button');b.className='wide';b.textContent=(equipped===o.name?'✓ ':'')+o.name;b.onclick=()=>{equipped=o.name;save();makePlayer();show('locker')};c.append(b)})}else if(tab==='pass'){$('heading').textContent='Battle Pass';$('desc').textContent='100 Stufen mit Belohnungen.';c.innerHTML=`<p>Freischaltung: 1.000 Teapacks</p><p class="muted">Status: ${pass?'Premium freigeschaltet':'Kostenloser Pass'}</p><button class="primary wide" id="buyPass">${pass?'Battle Pass gekauft':'Battle Pass für 1.000 TP kaufen'}</button><p class="muted">Dein Kauf wird automatisch gespeichert.</p>`;$('buyPass').onclick=()=>{if(pass)return toast('Battle Pass bereits gekauft');if(coins<1000)return toast('Nicht genug Teapacks');coins-=1000;pass=true;save();show('pass');toast('Battle Pass freigeschaltet!') }}else{$('heading').textContent='Einstellungen';$('desc').textContent='Steuerung und Grafik';c.innerHTML='<p class="muted">Querformat empfohlen. Spielstand wird auf diesem Gerät automatisch gespeichert.</p>'}};
let mode='Solo';window.setMode=m=>{mode=m;toast(m+' ausgewählt')};window.startGame=()=>{game=true;$('panel').style.display='none';$('gamehud').style.display='block';$('touch').style.display='block';player.position.set(0,0,0);playerYaw=camYaw=0;inventory=['Spitzhacke',null,null,null,null,null];selected=0;ammo=0;resources={wood:0,stone:0,metal:0};$('wood').textContent='0';$('stone').textContent='0';$('metal').textContent='0';$('remaining').textContent=mode==='Solo'?99:98;slots();toast('Runde gestartet! Fadenkreuz in der Mitte.')};function nearest(){return nodes.find(n=>n.hp>0&&Math.hypot(n.x-player.position.x,n.z-player.position.z)<3)}function lootNearby(){let l=loot.find(x=>!x.opened&&Math.hypot(x.x-player.position.x,x.z-player.position.z)<3);if(!l)return toast('Keine Kiste in Reichweite');l.opened=true;scene.remove(l.obj);if(l.ammoBox){ammo+=60;toast('+60 Munition')}else{let w=weaponNames[1+Math.floor(Math.random()*5)],slot=inventory.findIndex((v,i)=>i>0&&!v);if(slot<0)slot=1;inventory[slot]=w;ammo+=30;toast(w+' gefunden · +30 Munition')}slots()}
function shoot(){if(selected===0){let n=nearest();if(!n)return lootNearby();n.hp--;let amount=n.type==='wood'?35:25;resources[n.type]=Math.min(999,resources[n.type]+amount);$(n.type).textContent=resources[n.type];if(n.hp<=0){scene.remove(n.obj);n.hp=0}toast('+'+amount+' '+n.type);return}if(!inventory[selected])return toast('Waffenplatz leer');if(ammo<=0)return toast('Keine Munition – suche Munitionskisten');ammo--;slots();shotFlash=5;let origin=new THREE.Vector3();camera.getWorldDirection(origin);let ray=new THREE.Raycaster(camera.position,origin,0,60);let target=ray.intersectObjects(nodes.map(n=>n.obj),true)[0];if(target){let n=nodes.find(n=>n.obj===target.object||n.obj===target.object.parent);if(n){n.hp--;let amount=n.type==='wood'?35:25;resources[n.type]=Math.min(999,resources[n.type]+amount);$(n.type).textContent=resources[n.type]}}toast('Schuss!')}
$('joy').addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;$('joy').setPointerCapture(e.pointerId)});$('joy').addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;let r=$('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=38;if(l>m){dx*=m/l;dy*=m/l}moveX=dx/m;moveY=dy/m;$('knob').style.transform=`translate(${dx}px,${dy}px)`});function joyEnd(e){if(e.pointerId===joyId){joyId=null;moveX=moveY=0;$('knob').style.transform=''}}$('joy').addEventListener('pointerup',joyEnd);$('joy').addEventListener('pointercancel',joyEnd);$('scene').addEventListener('pointerdown',e=>{if(game&&e.clientX>innerWidth*.4){lookId=e.pointerId;lastLook={x:e.clientX,y:e.clientY}}});$('scene').addEventListener('pointermove',e=>{if(e.pointerId!==lookId||!lastLook)return;let dx=e.clientX-lastLook.x,dy=e.clientY-lastLook.y;camYaw-=dx*.006;camPitch=Math.max(-.35,Math.min(.6,camPitch+dy*.004));lastLook={x:e.clientX,y:e.clientY}});function lookEnd(e){if(e.pointerId===lookId){lookId=null;lastLook=null}}$('scene').addEventListener('pointerup',lookEnd);$('scene').addEventListener('pointercancel',lookEnd);addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')shoot();if(e.code.startsWith('Digit')){let n=+e.code.slice(5);if(n>=1&&n<=5){selected=n;makeGun(inventory[selected]||'Spitzhacke');slots()}}});addEventListener('keyup',e=>keys[e.code]=false);$('fire').onclick=shoot;$('use').onclick=lootNearby;$('switch').onclick=()=>{selected=(selected+1)%6;makeGun(inventory[selected]||'Spitzhacke');slots()};$('jump').onclick=()=>{player.position.y=.55;setTimeout(()=>player.position.y=0,260)};init();save();show('play');slots();
</script></body></html>
